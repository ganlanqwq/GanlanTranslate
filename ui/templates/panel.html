<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甘岚翻译 - 迷你面板</title>
    <style>
        /* 迷你面板专用：浅色主题，透明圆角窗口（叠加在 VRChat 上时圆角外透明） */
        :root {
            /* Windows 10 上透明窗口不生效，给窗口一个和卡片协调的底色；圆角由 panel_app.py 裁窗口区域 */
            --bg: #E9F0EA;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-2: rgba(255, 255, 255, 0.98);
            --primary: #1e563d;
            --primary-soft: rgba(30, 86, 61, 0.12);
            --text-main: #20241f;
            --text-muted: #7a7f74;
            --text-ongoing: #9aa095;
            --success: #3f8f5f;
            --danger: #c4635a;
            --border: rgba(30, 86, 61, 0.16);
            --shadow: 0 8px 24px rgba(40, 60, 45, 0.18);
        }

        body {
            margin: 0;
            padding: 8px;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            flex: 1;
            display: flex;
            padding: 0;
            gap: 8px;
            align-items: stretch;
            min-width: 0;
            max-width: 100%;
        }

        .main-column {
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .text-container {
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            background-color: var(--surface);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .text-container.with-reverse {
            justify-content: flex-start;
            padding-top: 12px;
            padding-bottom: 12px;
        }

        .text-line {
            font-size: 1.05rem;
            line-height: 1.45;
            min-height: 24px;
            white-space: nowrap;
            overflow: hidden;
            text-align: left;
            font-feature-settings: "kern";
        }

        .text-line.hidden {
            display: none;
        }

        .text-line.ongoing {
            color: var(--text-ongoing);
        }

        .text-line.original {
            font-size: 0.85em;
            color: var(--text-muted);
            font-family: "JetBrains Mono", Consolas, monospace;
            letter-spacing: 0.01em;
        }

        .text-line.translated {
            color: var(--text-main);
            font-weight: 500;
        }

        .text-line.reverse {
            font-size: 0.78em;
            color: var(--text-muted);
            font-style: italic;
        }

        .others-feed {
            display: none;
            flex-direction: column;
            gap: 8px;
            overflow-x: hidden;
            overflow-y: auto;
            max-height: 48%;
            margin-bottom: 2px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .others-feed.visible {
            display: flex;
        }

        .others-utterance {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .others-feed .text-line {
            min-height: 20px;
        }

        .role-label {
            font-size: 0.72rem;
            line-height: 1.2;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: none;
            flex-shrink: 0;
        }

        body.role-self #others-feed {
            display: none !important;
        }

        body.role-others #speech-text,
        body.role-others #trans-text,
        body.role-others #reverse-trans-text {
            display: none !important;
        }

        body.role-others .others-feed,
        body.role-others .others-feed.visible {
            display: flex;
            max-height: none;
            flex: 1 1 auto;
            border-bottom: none;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--bg);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(30, 86, 61, 0.22);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-button {
            display: none;
        }

        .screen-feed,
        .screen-status {
            display: none;
        }

        body.role-screen #speech-text,
        body.role-screen #trans-text,
        body.role-screen #reverse-trans-text,
        body.role-screen #others-feed {
            display: none !important;
        }

        body.role-screen .text-container {
            justify-content: flex-start;
        }

        body.role-screen .screen-feed {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.role-screen .screen-status {
            display: block;
            font-size: 0.75rem;
            line-height: 1.3;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        body.role-screen .screen-status.error {
            color: var(--danger);
        }

        .screen-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .screen-feed .text-line {
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 0;
        }

        .btn-screen {
            display: none;
        }

        body.role-screen .btn-screen {
            display: flex;
        }

        .btn-screen.busy {
            background-color: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
            cursor: progress;
        }

        /* Quick language switch buttons */
        .quick-lang-bar {
            display: flex;
            gap: 6px;
            padding: 0 2px;
            flex-shrink: 0;
        }

        .quick-lang-btn {
            flex: 1;
            height: 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            background: var(--surface-2);
            transition: all 0.18s ease;
            padding: 0 8px;
            white-space: nowrap;
            line-height: 22px;
            text-align: center;
        }

        .quick-lang-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: var(--primary);
        }

        .quick-lang-btn.active {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(30, 86, 61, 0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(40, 60, 45, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            align-self: center;
            line-height: 1;
            background: var(--surface-2);
        }

        .btn svg {
            display: block;
        }

        .btn:hover:not(.btn-disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(40, 60, 45, 0.2);
            border-color: var(--primary);
        }

        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .btn-disabled {
            background-color: var(--surface);
            color: var(--text-ongoing);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            border-color: var(--border);
        }

        .btn-lock.locked {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-close {
            color: var(--text-muted);
        }

        .btn-close:hover:not(.btn-disabled) {
            color: var(--danger);
            border-color: var(--danger);
        }

        .resize-handle {
            position: fixed;
            background: transparent;
            z-index: 9999;
        }

        .resize-handle.left {
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: ew-resize;
        }

        .resize-handle.right {
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: ew-resize;
        }

        .resize-handle.bottom {
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            cursor: ns-resize;
        }

        .drag-surface {
            -webkit-app-region: no-drag;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="container drag-surface">
        <div class="main-column">
            <div class="text-container">
                <div id="role-label" class="role-label">自我</div>
                <!-- 翻译他人：与自我翻译相同的 original / translated 行样式 -->
                <div id="others-feed" class="others-feed" aria-live="polite"></div>
                <!-- 屏幕翻译：每段原文[语言] 下一行译文 -->
                <div id="screen-feed" class="screen-feed" aria-live="polite"></div>
                <div id="screen-status" class="screen-status"></div>
                <!-- 识别文本 -->
                <div id="speech-text" class="text-line original"></div>
                <!-- 翻译文本 -->
                <div id="trans-text" class="text-line translated"></div>
                <!-- 反向翻译文本 -->
                <div id="reverse-trans-text" class="text-line reverse hidden"></div>
            </div>
            <!-- 快速切换目标语言 -->
            <div class="quick-lang-bar" id="quick-lang-bar"></div>
        </div>
        <div class="controls">
            <button id="screen-btn" class="btn btn-screen" onclick="requestScreenTranslation()" title="翻译屏幕"><svg width="18"
                    height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                    <circle cx="12" cy="13" r="4" />
                </svg></button>
            <button id="toggle-btn" class="btn btn-disabled" onclick="toggleService()" title="启动/停止"><svg width="20"
                    height="20" viewBox="0 0 20 20" fill="white">
                    <circle cx="10" cy="10" r="2" opacity="0.6" />
                </svg></button>
            <button id="lock-btn" class="btn btn-lock" onclick="toggleLock()" title="锁定位置"><svg width="18" height="18"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg></button>
            <button id="close-btn" class="btn btn-close" onclick="closePanel()" title="关闭面板"><svg width="18" height="18"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg></button>
        </div>
    </div>

    <script>
        let isRunning = false;
        let pendingServiceAction = null;
        let pendingServiceActionStartedAt = 0;
        let lastShowReverseTranslation = null;
        let currentTargetLanguage = '';
        let currentSecondaryTargetLanguage = '';
        let switchingLanguage = false;
        let switchingSecondaryLanguage = false;
        let locked = false;
        const QUICK_LANG_DEFAULTS = ['en', 'zh-CN', 'ja', 'ko'];
        const QUICK_LANG_BAR_HEIGHT = 27;
        const SERVICE_ACTION_TIMEOUT_MS = 30000;
        const PANEL_ROLE = (function () {
            try {
                const role = new URLSearchParams(window.location.search).get('role');
                return role === 'others' || role === 'screen' ? role : 'self';
            } catch (e) {
                return 'self';
            }
        })();
        const PANEL_LOCK_STORAGE_KEY = 'panel_locked_' + PANEL_ROLE;
        document.body.classList.add('role-' + PANEL_ROLE);
        // 界面语言由后端决定（跟系统语言，网页里手动选过就跟网页）
        const PANEL_UI_LANG = {{ ui_language|tojson }};
        const PANEL_TEXT = {
            'zh-CN': {
                self: '自我', others: '他人', screen: '屏幕',
                screenBtn: '翻译屏幕', toggle: '启动/停止', lock: '锁定位置', close: '关闭面板',
                waitingOthers: '等待他人语音…', screenEmpty: '点右侧相机按钮翻译 VRChat 画面',
                screenStopped: '屏幕模式未启动，点右侧 ▶ 启动', error: '出错了', busy: '处理中…',
                hotkey: '热键 {k}', failed: '请求失败', colon: '：'
            },
            en: {
                self: 'Me', others: 'Others', screen: 'Screen',
                screenBtn: 'Translate screen', toggle: 'Start / stop', lock: 'Lock position', close: 'Close panel',
                waitingOthers: 'Waiting for others to speak…', screenEmpty: 'Click the camera button on the right to translate the VRChat screen',
                screenStopped: 'Screen mode is off. Click ▶ on the right to start', error: 'Something went wrong', busy: 'Working…',
                hotkey: 'Hotkey {k}', failed: 'Request failed', colon: ': '
            },
            ja: {
                self: '自分', others: '他人', screen: '画面',
                screenBtn: '画面を翻訳', toggle: '開始 / 停止', lock: '位置を固定', close: 'パネルを閉じる',
                waitingOthers: '他の人の発言を待っています…', screenEmpty: '右のカメラボタンで VRChat の画面を翻訳',
                screenStopped: '画面モードが停止中です。右の ▶ で開始', error: 'エラーが発生しました', busy: '処理中…',
                hotkey: 'ホットキー {k}', failed: 'リクエストに失敗しました', colon: '：'
            },
            ko: {
                self: '나', others: '다른 사람', screen: '화면',
                screenBtn: '화면 번역', toggle: '시작 / 정지', lock: '위치 고정', close: '패널 닫기',
                waitingOthers: '다른 사람의 음성을 기다리는 중…', screenEmpty: '오른쪽 카메라 버튼으로 VRChat 화면을 번역',
                screenStopped: '화면 모드가 꺼져 있습니다. 오른쪽 ▶ 로 시작', error: '오류가 발생했습니다', busy: '처리 중…',
                hotkey: '단축키 {k}', failed: '요청 실패', colon: ': '
            }
        };
        function pt(key, vars) {
            const table = PANEL_TEXT[PANEL_UI_LANG] || PANEL_TEXT.en;
            let text = table[key] || PANEL_TEXT.en[key] || key;
            for (const [k, v] of Object.entries(vars || {})) text = text.replace('{' + k + '}', v);
            return text;
        }
        const _roleLabelEl = document.getElementById('role-label');
        if (_roleLabelEl) {
            _roleLabelEl.textContent = pt(PANEL_ROLE);
        }
        [['screen-btn', 'screenBtn'], ['toggle-btn', 'toggle'], ['lock-btn', 'lock'], ['close-btn', 'close']]
            .forEach(([id, key]) => { const el = document.getElementById(id); if (el) el.title = pt(key); });
        const TARGET_LANGUAGE_ENDPOINTS = {
            self: '/api/target-language',
            others: '/api/others-target-language',
            screen: '/api/screen-target-language',
        };
        const TARGET_LANGUAGE_CONFIG_SECTIONS = {
            self: 'translation',
            others: 'others_translation',
            screen: 'screen_translation',
        };
        let screenRequestPending = false;
        let screenRequestError = '';

        function hasPanelApi() {
            return !!(window.pywebview && window.pywebview.api);
        }

        function getLockInitialState() {
            try {
                const stored = localStorage.getItem(PANEL_LOCK_STORAGE_KEY);
                if (stored !== null) return stored === 'true';
            } catch (e) {}
            return false;
        }

        function renderToggleButton(state) {
            const btn = document.getElementById('toggle-btn');
            if (!btn) return;

            if (state === 'starting' || state === 'stopping') {
                btn.disabled = true;
                btn.className = 'btn btn-disabled';
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="white"><circle cx="10" cy="10" r="2" opacity="0.6"/></svg>';
                return;
            }

            btn.disabled = false;
            if (state === 'running') {
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="white"><rect x="3" y="3" width="14" height="14" rx="2"/></svg>';
                btn.className = 'btn btn-danger';
                return;
            }

            btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 20 20" fill="white"><polygon points="5,2 18,10 5,18"/></svg>';
            btn.className = 'btn btn-success';
        }

        function renderLockButton() {
            const btn = document.getElementById('lock-btn');
            if (!btn) return;
            btn.classList.toggle('locked', locked);
            if (locked) {
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
            } else {
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
            }
        }

        async function toggleLock() {
            locked = !locked;
            try {
                localStorage.setItem(PANEL_LOCK_STORAGE_KEY, locked ? 'true' : 'false');
            } catch (e) {}
            if (hasPanelApi() && window.pywebview.api.set_locked) {
                try {
                    await window.pywebview.api.set_locked(locked);
                } catch (e) {}
            }
            renderLockButton();
        }

        function clearPendingServiceAction() {
            pendingServiceAction = null;
            pendingServiceActionStartedAt = 0;
        }

        function setPendingServiceAction(action) {
            pendingServiceAction = action;
            pendingServiceActionStartedAt = Date.now();
            renderToggleButton(action);
        }

        function getEffectiveToggleState(lifecycle) {
            const actualLifecycle = lifecycle || (isRunning ? 'running' : 'stopped');

            if (
                pendingServiceAction &&
                Date.now() - pendingServiceActionStartedAt > SERVICE_ACTION_TIMEOUT_MS
            ) {
                clearPendingServiceAction();
            }

            if (pendingServiceAction === 'starting') {
                if (actualLifecycle === 'running') {
                    clearPendingServiceAction();
                    return 'running';
                }
                if (actualLifecycle === 'stopping') {
                    clearPendingServiceAction();
                    return 'stopping';
                }
                return 'starting';
            }

            if (pendingServiceAction === 'stopping') {
                if (actualLifecycle === 'stopped') {
                    clearPendingServiceAction();
                    return 'stopped';
                }
                if (actualLifecycle === 'running') {
                    clearPendingServiceAction();
                    return 'running';
                }
                return 'stopping';
            }

            if (actualLifecycle === 'starting' || actualLifecycle === 'stopping') {
                return actualLifecycle;
            }

            return actualLifecycle === 'running' ? 'running' : 'stopped';
        }

        function getLangDisplayName(code) {
            return code;
        }

        function normalizeQuickLanguages(languages) {
            return QUICK_LANG_DEFAULTS.map((fallback, index) => {
                const value = Array.isArray(languages) ? languages[index] : null;
                return typeof value === 'string' && value.trim() ? value.trim() : fallback;
            });
        }

        function getInitialQuickLangSettings() {
            const params = new URLSearchParams(window.location.search);
            const queryLangs = normalizeQuickLanguages(params.getAll('quick_lang'));
            const hasQueryLangs = params.getAll('quick_lang').length === 4;
            let enabled = true;

            if (params.has('quick_lang_bar')) {
                const rawEnabled = (params.get('quick_lang_bar') || '').trim().toLowerCase();
                enabled = !['', '0', 'false', 'no', 'off'].includes(rawEnabled);
            } else {
                const storedEnabled = localStorage.getItem('panel_quick_lang_bar_enabled');
                enabled = storedEnabled === null ? true : storedEnabled === 'true';
            }

            if (hasQueryLangs) {
                return { enabled, languages: queryLangs };
            }

            try {
                const stored = localStorage.getItem('panel_quick_languages');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    return { enabled, languages: normalizeQuickLanguages(parsed) };
                }
            } catch (e) {
                // ignore
            }

            return { enabled, languages: QUICK_LANG_DEFAULTS.slice() };
        }

        const INITIAL_QUICK_LANG_SETTINGS = getInitialQuickLangSettings();

        function getQuickLanguages() {
            return INITIAL_QUICK_LANG_SETTINGS.languages;
        }

        function renderQuickLangButtons() {
            const bar = document.getElementById('quick-lang-bar');
            if (!bar) return;
            if (!INITIAL_QUICK_LANG_SETTINGS.enabled) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }
            bar.style.display = '';
            const langs = getQuickLanguages();
            bar.innerHTML = '';
            langs.forEach((lang) => {
                const btn = document.createElement('button');
                btn.className = 'quick-lang-btn';
                btn.textContent = getLangDisplayName(lang);
                btn.dataset.lang = lang;
                if (lang.toLowerCase() === (currentTargetLanguage || '').toLowerCase()) {
                    btn.classList.add('active');
                }
                btn.addEventListener('click', () => switchTargetLanguage(lang));
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (PANEL_ROLE === 'screen') return;
                    switchSecondaryTargetLanguage(lang);
                });
                bar.appendChild(btn);
            });
        }

        function updateQuickLangActiveState() {
            const buttons = document.querySelectorAll('.quick-lang-btn');
            buttons.forEach((btn) => {
                const lang = btn.dataset.lang.toLowerCase();
                const isActive = lang === (currentTargetLanguage || '').toLowerCase();
                const isSecondary = lang === (currentSecondaryTargetLanguage || '').toLowerCase();

                btn.classList.toggle('active', isActive);

                // Show secondary indicator
                let indicator = btn.querySelector('.secondary-indicator');
                if (isSecondary) {
                    if (!indicator) {
                        indicator = document.createElement('span');
                        indicator.className = 'secondary-indicator';
                        indicator.textContent = '2nd';
                        indicator.style.position = 'absolute';
                        indicator.style.right = '2px';
                        indicator.style.bottom = '1px';
                        indicator.style.fontSize = '8px';
                        indicator.style.lineHeight = '1';
                        indicator.style.color = 'var(--text-muted)';
                        indicator.style.pointerEvents = 'none';
                        btn.style.position = 'relative';
                        btn.appendChild(indicator);
                    }
                } else if (indicator) {
                    indicator.remove();
                }
            });
        }

        async function switchSecondaryTargetLanguage(lang) {
            if (switchingSecondaryLanguage) return;
            switchingSecondaryLanguage = true;
            try {
                const res = await fetch('/api/secondary-target-language', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secondary_target_language: lang })
                });
                const data = await res.json();
                if (data.success) {
                    currentSecondaryTargetLanguage = data.secondary_target_language;
                    localStorage.setItem('secondary_target_language', data.secondary_target_language);
                    updateQuickLangActiveState();

                    // Visual feedback: briefly highlight the button
                    const btn = document.querySelector(`.quick-lang-btn[data-lang="${lang}"]`);
                    if (btn) {
                        const originalTransition = btn.style.transition;
                        btn.style.transition = 'none';
                        btn.style.backgroundColor = 'rgba(78, 140, 255, 0.4)';
                        setTimeout(() => {
                            btn.style.transition = originalTransition;
                            btn.style.backgroundColor = '';
                        }, 200);
                    }
                }
            } catch (e) {
                console.error('Failed to switch secondary target language:', e);
            } finally {
                switchingSecondaryLanguage = false;
            }
        }

        async function switchTargetLanguage(lang) {
            if (switchingLanguage) return;
            switchingLanguage = true;
            const endpoint = TARGET_LANGUAGE_ENDPOINTS[PANEL_ROLE];
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_language: lang })
                });
                const data = await res.json();
                if (data.success) {
                    currentTargetLanguage = data.target_language;
                    updateQuickLangActiveState();
                    try {
                        const cfgKey = 'vrchat_translator_config';
                        const raw = localStorage.getItem(cfgKey);
                        if (raw) {
                            const cfg = JSON.parse(raw);
                            const section = TARGET_LANGUAGE_CONFIG_SECTIONS[PANEL_ROLE];
                            if (!cfg[section]) cfg[section] = {};
                            cfg[section].target_language = data.target_language;
                            localStorage.setItem(cfgKey, JSON.stringify(cfg));
                        }
                    } catch (e) {
                        console.warn('persist target_language to main config:', e);
                    }
                }
            } catch (e) {
                console.error('Failed to switch target language:', e);
            } finally {
                switchingLanguage = false;
            }
        }

        // ------------------------------------------------------------------
        // 拖动窗口（仅 frameless 时有效；锁定状态下忽略）
        // ------------------------------------------------------------------
        function initDragSurface() {
            if (!(hasPanelApi() && window.pywebview.api.move_window)) {
                return;
            }
            const surface = document.body;
            let dragging = false;
            let startScreenX = 0;
            let startScreenY = 0;
            let startWinX = 0;
            let startWinY = 0;

            surface.addEventListener('mousedown', (event) => {
                if (locked) return;
                if (event.target.closest('button')) return;
                if (event.target.closest('.quick-lang-btn')) return;
                dragging = true;
                startScreenX = event.screenX;
                startScreenY = event.screenY;
                startWinX = window.screenX;
                startWinY = window.screenY;
                event.preventDefault();
            });

            surface.addEventListener('mousemove', (event) => {
                if (!dragging || locked) return;
                const dx = event.screenX - startScreenX;
                const dy = event.screenY - startScreenY;
                if (dx === 0 && dy === 0) return;
                const newX = Math.round(startWinX + dx);
                const newY = Math.round(startWinY + dy);
                try {
                    window.pywebview.api.move_window(newX, newY);
                } catch (e) {}
            });

            document.addEventListener('mouseup', () => {
                dragging = false;
            });
        }

        function initResizeHandles() {
            if (!(hasPanelApi() && window.pywebview.api.set_bounds)) {
                return;
            }

            if (document.querySelector('.resize-handle')) {
                return;
            }

            let resizing = false;
            let resizeDir = null;
            let startX = 0;
            let startY = 0;
            let startWidth = 0;
            let startHeight = 0;
            let startWinX = 0;
            let startWinY = 0;
            const minWidth = 400;

            function isQuickLangBarVisible() {
                const quickLangBar = document.getElementById('quick-lang-bar');
                return !!quickLangBar && getComputedStyle(quickLangBar).display !== 'none';
            }

            function getMinHeight() {
                const textContainer = document.querySelector('.text-container');
                const baseHeight = textContainer && textContainer.classList.contains('with-reverse') ? 120 : 100;
                return isQuickLangBarVisible() ? baseHeight : Math.max(60, baseHeight - QUICK_LANG_BAR_HEIGHT);
            }

            function stopResize() {
                if (!resizing) {
                    return;
                }

                resizing = false;
                resizeDir = null;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', doResize);
                document.removeEventListener('mouseup', stopResize);
            }

            function doResize(event) {
                if (!resizing) {
                    return;
                }

                let newWidth = startWidth;
                let newHeight = startHeight;
                let newX = startWinX;
                let newY = startWinY;
                const minHeight = getMinHeight();

                if (resizeDir === 'left') {
                    const rightEdge = startWinX + startWidth;
                    newX = event.screenX;
                    newWidth = Math.max(minWidth, rightEdge - newX);
                    if (newWidth === minWidth) {
                        newX = rightEdge - minWidth;
                    }
                } else if (resizeDir === 'right') {
                    newWidth = Math.max(minWidth, startWidth + (event.clientX - startX));
                } else if (resizeDir === 'bottom') {
                    newHeight = Math.max(minHeight, startHeight + (event.clientY - startY));
                }

                if (hasPanelApi() && window.pywebview.api.set_bounds) {
                    window.pywebview.api.set_bounds(
                        Math.round(newX),
                        Math.round(newY),
                        Math.round(newWidth),
                        Math.round(newHeight)
                    );
                }
            }

            function startResize(direction, event) {
                event.preventDefault();
                event.stopPropagation();
                resizing = true;
                resizeDir = direction;
                startX = event.clientX;
                startY = event.clientY;
                startWidth = window.innerWidth;
                startHeight = window.innerHeight;
                startWinX = window.screenX;
                startWinY = window.screenY;
                document.body.style.cursor = direction === 'bottom' ? 'ns-resize' : 'ew-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', stopResize);
            }

            ['left', 'right', 'bottom'].forEach((direction) => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${direction}`;
                handle.addEventListener('mousedown', (event) => startResize(direction, event));
                document.body.appendChild(handle);
            });
        }

        async function closePanel() {
            if (hasPanelApi() && window.pywebview.api.close_window) {
                try {
                    await window.pywebview.api.close_window();
                    return;
                } catch (e) {}
            }
            window.close();
        }

        async function applyReverseTranslationMode(showReverseTranslation) {
            const textContainer = document.querySelector('.text-container');
            const elReverse = document.getElementById('reverse-trans-text');

            textContainer.classList.toggle('with-reverse', showReverseTranslation);
            elReverse.classList.toggle('hidden', !showReverseTranslation);
            if (!showReverseTranslation && elReverse.textContent !== '') {
                elReverse.textContent = '';
            }
            lastShowReverseTranslation = showReverseTranslation;
        }

        async function fetchState() {
            try {
                const statusRes = await fetch('/api/status');
                const statusData = await statusRes.json();
                const subRes = await fetch('/api/subtitles');
                const subData = await subRes.json();

                // 每个悬浮窗只管自己的模式（self / others / screen）
                const rawMode = String((statusData.modes || {})[PANEL_ROLE] || 'stopped');
                const lifecycle = ['running', 'starting', 'stopping'].includes(rawMode) ? rawMode : 'stopped';
                isRunning = lifecycle === 'running';
                renderToggleButton(getEffectiveToggleState(lifecycle));
                await applyReverseTranslationMode(!!subData.show_reverse_translation);

                let liveTarget = subData.target_language;
                if (PANEL_ROLE === 'others') {
                    liveTarget = subData.others_target_language || subData.target_language;
                } else if (PANEL_ROLE === 'screen') {
                    liveTarget = (subData.screen || {}).target_language || liveTarget;
                }
                if (liveTarget && liveTarget !== currentTargetLanguage) {
                    currentTargetLanguage = liveTarget;
                    updateQuickLangActiveState();
                }

                if (subData.secondary_target_language && subData.secondary_target_language !== currentSecondaryTargetLanguage) {
                    currentSecondaryTargetLanguage = subData.secondary_target_language;
                    updateQuickLangActiveState();
                }

                const elOrig = document.getElementById('speech-text');
                const elTrans = document.getElementById('trans-text');
                const elReverse = document.getElementById('reverse-trans-text');
                const elOthers = document.getElementById('others-feed');

                if (PANEL_ROLE === 'screen') {
                    renderScreenState(subData.screen || {});
                    return;
                }

                if (PANEL_ROLE === 'others') {
                    const others = subData.others || {};
                    const othersLines = Array.isArray(others.lines) ? others.lines : [];
                    if (elOthers) {
                        if (othersLines.length > 0) {
                            const html = othersLines.map((item) => {
                                const ongoingClass = others.ongoing ? ' ongoing' : '';
                                return (
                                    `<div class="others-utterance">` +
                                    `<div class="text-line original${ongoingClass}"></div>` +
                                    `<div class="text-line translated${ongoingClass}"></div>` +
                                    `</div>`
                                );
                            }).join('');
                            const signature = othersLines.map(
                                (i) => `${i.speaker}|${i.original}|${i.lang}|${i.translated}`
                            ).join('\n') + `|ong:${!!others.ongoing}`;
                            if (elOthers.dataset.sig !== signature) {
                                elOthers.dataset.sig = signature;
                                elOthers.innerHTML = html;
                                const blocks = elOthers.querySelectorAll('.others-utterance');
                                othersLines.forEach((item, idx) => {
                                    const block = blocks[idx];
                                    if (!block) return;
                                    const o = block.querySelector('.original');
                                    const t = block.querySelector('.translated');
                                    if (o) {
                                        o.textContent = `${item.speaker || '?'}${pt('colon')}${item.original || ''}[${item.lang || 'und'}]`;
                                        o.scrollLeft = o.scrollWidth;
                                    }
                                    if (t) {
                                        t.textContent = item.translated || '';
                                        t.scrollLeft = t.scrollWidth;
                                    }
                                });
                                elOthers.scrollTop = elOthers.scrollHeight;
                            } else {
                                elOthers.querySelectorAll('.text-line').forEach((node) => {
                                    node.classList.toggle('ongoing', !!others.ongoing);
                                });
                            }
                            elOthers.classList.add('visible');
                        } else {
                            const emptySig = 'empty';
                            if (elOthers.dataset.sig !== emptySig) {
                                elOthers.dataset.sig = emptySig;
                                elOthers.innerHTML = '<div class="text-line original"></div>';
                                elOthers.firstChild.textContent = pt('waitingOthers');
                            }
                            elOthers.classList.add('visible');
                        }
                    }
                    return;
                }

                if (elOthers) {
                    elOthers.innerHTML = '';
                    elOthers.dataset.sig = '';
                    elOthers.classList.remove('visible');
                }

                if (isRunning) {
                    // If text changes, we want to update and keep it scrolled to right 
                    // (so if it overflows, the rightmost latest text is visible)
                    if (elOrig.textContent !== subData.original) {
                        elOrig.textContent = subData.original || '';
                        elOrig.scrollLeft = elOrig.scrollWidth;
                    }
                    if (elTrans.textContent !== subData.translated) {
                        elTrans.textContent = subData.translated || '';
                        elTrans.scrollLeft = elTrans.scrollWidth;
                    }
                    if (subData.show_reverse_translation && elReverse.textContent !== (subData.reverse_translated || '')) {
                        elReverse.textContent = subData.reverse_translated || '';
                        elReverse.scrollLeft = elReverse.scrollWidth;
                    }

                    if (subData.ongoing) {
                        elOrig.classList.add('ongoing');
                        elTrans.classList.add('ongoing');
                        elReverse.classList.add('ongoing');
                    } else {
                        elOrig.classList.remove('ongoing');
                        elTrans.classList.remove('ongoing');
                        elReverse.classList.remove('ongoing');
                    }
                } else {
                    if (elOrig.textContent !== '' || elTrans.textContent !== '' || elReverse.textContent !== '') {
                        elOrig.textContent = '';
                        elTrans.textContent = '';
                        elReverse.textContent = '';
                    }
                    elOrig.classList.remove('ongoing');
                    elTrans.classList.remove('ongoing');
                    elReverse.classList.remove('ongoing');
                }
            } catch (err) {
                console.error("Failed to fetch state:", err);
            }
        }

        function renderScreenState(screen) {
            const feed = document.getElementById('screen-feed');
            const statusEl = document.getElementById('screen-status');
            const btn = document.getElementById('screen-btn');
            const items = Array.isArray(screen.items) ? screen.items : [];
            const busy = !!screen.busy || screenRequestPending;

            if (btn) btn.classList.toggle('busy', busy);

            if (feed) {
                const signature = items.length
                    ? items.map((i) => `${i.original}|${i.lang}|${i.translated}`).join('\n')
                    : 'empty';
                if (feed.dataset.sig !== signature) {
                    feed.dataset.sig = signature;
                    feed.innerHTML = '';
                    if (!items.length) {
                        const empty = document.createElement('div');
                        empty.className = 'text-line original';
                        empty.textContent = pt('screenEmpty');
                        feed.appendChild(empty);
                    }
                    items.forEach((item) => {
                        const block = document.createElement('div');
                        block.className = 'screen-item';
                        const o = document.createElement('div');
                        o.className = 'text-line original';
                        o.textContent = `${item.original || ''} [${item.lang || 'und'}]`;
                        const t = document.createElement('div');
                        t.className = 'text-line translated' + (item.translated ? '' : ' ongoing');
                        t.textContent = item.translated || '…';
                        block.appendChild(o);
                        block.appendChild(t);
                        feed.appendChild(block);
                    });
                    feed.scrollTop = 0;
                }
            }

            if (statusEl) {
                let text = '';
                let isError = false;
                if (!isRunning) {
                    text = pt('screenStopped');
                } else if (screenRequestError) {
                    text = screenRequestError;
                    isError = true;
                } else if (screen.status === 'error') {
                    text = screen.message || pt('error');
                    isError = true;
                } else if (busy) {
                    text = screen.message || pt('busy');
                } else {
                    text = screen.hotkey ? pt('hotkey', { k: screen.hotkey }) : (screen.message || '');
                }
                statusEl.textContent = text;
                statusEl.classList.toggle('error', isError);
            }
        }

        async function requestScreenTranslation() {
            if (screenRequestPending) return;
            screenRequestPending = true;
            screenRequestError = '';
            try {
                const res = await fetch('/api/screen-translate', { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.success === false) {
                    screenRequestError = data.message || pt('failed');
                    setTimeout(() => { screenRequestError = ''; }, 4000);
                }
            } catch (e) {
                screenRequestError = pt('failed');
                setTimeout(() => { screenRequestError = ''; }, 4000);
            } finally {
                screenRequestPending = false;
            }
            void fetchState();
        }

        async function toggleService() {
            if (pendingServiceAction) {
                return;
            }

            const wasRunning = isRunning;
            setPendingServiceAction(wasRunning ? 'stopping' : 'starting');

            try {
                // API Keys 已由大面板在打开悬浮窗时同步到后端
                const response = await fetch(wasRunning ? '/api/modes/stop' : '/api/modes/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ modes: [PANEL_ROLE], api_keys: {} })
                });

                const payload = await response.json().catch(() => ({}));
                if (!response.ok || payload.success === false) {
                    clearPendingServiceAction();
                    renderToggleButton(wasRunning ? 'running' : 'stopped');
                }
            } catch (err) {
                console.error('Failed to toggle service:', err);
                clearPendingServiceAction();
                renderToggleButton(wasRunning ? 'running' : 'stopped');
            }

            void fetchState();
        }

        // 初始化
        locked = getLockInitialState();
        renderLockButton();
        renderQuickLangButtons();
        renderToggleButton('stopped');
        setInterval(fetchState, 300);
        fetchState();

        // pywebview bridge 在页面加载完成后才注入，拖动/缩放/锁定的初始化
        // 必须等 window.pywebviewready 事件触发后再执行。
        function initPywebviewFeatures() {
            if (hasPanelApi() && window.pywebview.api.set_locked) {
                try {
                    window.pywebview.api.set_locked(locked);
                } catch (e) {}
            }
            initDragSurface();
            initResizeHandles();
        }

        if (hasPanelApi()) {
            // 已就绪（理论上不会发生，但做防御）
            initPywebviewFeatures();
        } else {
            window.addEventListener('pywebviewready', initPywebviewFeatures, { once: true });
            // 兜底：事件若未触发，轮询等待 bridge 就绪
            const pollTimer = setInterval(() => {
                if (hasPanelApi()) {
                    clearInterval(pollTimer);
                    initPywebviewFeatures();
                }
            }, 300);
            setTimeout(() => clearInterval(pollTimer), 10000);
        }
    </script>
